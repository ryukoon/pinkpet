name: APK 만들기

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: APK 빌드
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk pinkpet.apk
      - name: APK 보관 (Actions 탭에서 받기)
        uses: actions/upload-artifact@v4
        with:
          name: pinkpet-apk
          path: pinkpet.apk
      - name: 폰에서 바로 받도록 Releases에 올리기
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 진행해줘 펫 최신 버전
          files: pinkpet.apk
          make_latest: true
