name: APK 만들기

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: APK 빌드
        run: |
          chmod +x ./gradlew
          ./gradlew assembleFriendsDebug assembleFamilyDebug assembleKidsDebug --stacktrace
          cp app/build/outputs/apk/friends/debug/app-friends-debug.apk petfriends.apk
          cp app/build/outputs/apk/family/debug/app-family-debug.apk suafamily.apk
          cp app/build/outputs/apk/kids/debug/app-kids-debug.apk siawoo.apk
      - name: APK 보관 (Actions 탭에서 받기)
        uses: actions/upload-artifact@v4
        with:
          name: pet-apks
          path: |
            petfriends.apk
            suafamily.apk
            siawoo.apk
      - name: 폰에서 바로 받도록 Releases에 올리기
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 펫 앱 최신 버전 (펫 친구들 + 수아네 펫 + 시아·정우 펫)
          files: |
            petfriends.apk
            suafamily.apk
            siawoo.apk
          make_latest: true
