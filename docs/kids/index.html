<style>
/* VOICE: 장난스러운 8bit 다마고치
   IDEA: 폰 홈 화면 위를 돌아다니는 펫 친구들
   PICTURE: 여유곰과 부장님 도트 캐릭터, 아이콘이 발판
   COLOUR/TYPE: 보랏빛 노을 배경, 픽셀 외곽선 글자
   LAYOUT: 시계 위젯, 아이콘 그리드, 독, 모션 패널 */
*{box-sizing:border-box;margin:0;padding:0;min-width:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{height:100%;overflow:hidden;touch-action:none;overscroll-behavior:none}
body{font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:#fff;background:linear-gradient(172deg,#2d2552 0%,#5d3f82 40%,#b56a9a 75%,#f1a7a0 100%)}
#screen{position:fixed;inset:0;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
.widget{margin:22px 22px 4px}
.clock{font-size:clamp(46px,12vw,78px);font-weight:200;letter-spacing:-2px;line-height:1}
.date{opacity:.85;margin-top:6px;font-size:15px}
.grid{flex:1;display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));align-content:start;gap:30px 4px;padding:28px 12px 10px;overflow:hidden}
.app{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;text-shadow:0 1px 2px rgba(0,0,0,.45)}
.ibox{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;font-size:27px;box-shadow:0 4px 10px rgba(0,0,0,.25),inset 0 -3px 0 rgba(0,0,0,.12)}
.ibox.hit,.dock.hit{animation:hit .55s}
@keyframes hit{0%{transform:scale(1)}22%{transform:scale(1.12,.8)}50%{transform:scale(.94,1.08)}75%{transform:scale(1.03,.97)}100%{transform:scale(1)}}
.dock{margin:0 12px calc(12px + env(safe-area-inset-bottom));padding:12px 8px;border-radius:30px;background:rgba(255,255,255,.2);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:flex;justify-content:space-around}
.pet{position:fixed;left:0;top:0;z-index:10;touch-action:none;cursor:grab}
.pet canvas{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
.shadow{position:fixed;left:0;top:0;z-index:8;height:8px;border-radius:50%;background:rgba(30,10,40,.35);pointer-events:none}
.aura{position:fixed;left:0;top:0;z-index:9;display:none;pointer-events:none;border-radius:50% 50% 42% 42%;background:radial-gradient(ellipse at 50% 72%,rgba(255,235,245,.9) 0,rgba(255,110,165,.7) 30%,rgba(255,50,110,.3) 52%,transparent 70%);animation:flick .11s infinite alternate}
@keyframes flick{from{filter:brightness(1)}to{filter:brightness(1.35)}}
#ball{position:fixed;left:0;top:0;z-index:9;display:none;image-rendering:pixelated;pointer-events:none}
.fl{position:fixed;z-index:12;pointer-events:none;font-weight:900;font-size:18px;color:#fff;white-space:nowrap;transform:translate(-50%,0);
text-shadow:2px 0 #2a1f3d,-2px 0 #2a1f3d,0 2px #2a1f3d,0 -2px #2a1f3d,2px 2px #2a1f3d;animation:up 1.2s ease-out forwards}
.fl.boing{font-size:26px;color:#ffe45e;animation:boing 1.1s ease-out forwards}
.fl.z{font-size:16px;color:#cfe3ff;animation:zz 1.8s ease-out forwards}
@keyframes up{0%{opacity:0;transform:translate(-50%,8px) scale(.6)}15%{opacity:1;transform:translate(-50%,0) scale(1.1)}100%{opacity:0;transform:translate(-50%,-46px)}}
@keyframes boing{0%{opacity:0;transform:translate(-50%,0) scale(.3,1.6)}18%{opacity:1;transform:translate(-50%,-10px) scale(1.35,.75)}34%{transform:translate(-50%,-14px) scale(.85,1.2)}50%{transform:translate(-50%,-16px) scale(1.08,.94)}70%{opacity:1;transform:translate(-50%,-20px) scale(1)}100%{opacity:0;transform:translate(-50%,-40px)}}
@keyframes zz{0%{opacity:0;transform:translate(-50%,0)}20%{opacity:1}100%{opacity:0;transform:translate(10px,-50px) scale(1.4)}}
.bubble{position:fixed;left:0;top:0;z-index:12;display:none;pointer-events:none;background:#fff;color:#2a1f3d;font-size:14px;font-weight:800;padding:5px 10px;border:3px solid #2a1f3d;box-shadow:3px 3px 0 rgba(0,0,0,.25);white-space:nowrap}
.crack{position:fixed;z-index:15;pointer-events:none;transition:opacity 1s}
.shard{position:fixed;z-index:16;pointer-events:none;background:linear-gradient(135deg,rgba(255,255,255,.95),rgba(190,225,255,.75));box-shadow:0 0 2px rgba(30,20,60,.6)}
.flash{position:fixed;inset:0;z-index:14;background:#fff;pointer-events:none}
#menuBtn{position:fixed;right:14px;top:calc(16px + env(safe-area-inset-top));z-index:20;height:44px;padding:0 14px;border:3px solid #fff;background:#2a1f3d;color:#fff;font-weight:800;font-size:14px;box-shadow:3px 3px 0 rgba(0,0,0,.3)}
#panel{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top));bottom:calc(110px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:20;width:min(94vw,600px);background:rgba(34,24,56,.96);border:3px solid #fff;box-shadow:5px 5px 0 rgba(0,0,0,.3);padding:12px;display:none;flex-direction:column;gap:9px;touch-action:pan-y}
#panel.on{display:flex}
#panel h2{font-size:16px}
.row{display:flex;gap:7px;flex-wrap:wrap}
.row button{flex:1}
button{font:inherit;min-height:44px;border:2px solid #fff;background:#5d3f82;color:#fff;font-weight:800;font-size:13px;padding:0 8px}
button.on{background:#8a5a2b}button.off{background:#55506a;color:#cfc9e0}
button:active{filter:brightness(1.3)}
#moves{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;align-content:start;touch-action:pan-y;-webkit-overflow-scrolling:touch}
@media(max-width:420px){#moves{grid-template-columns:repeat(2,minmax(0,1fr))}}
#moves button{min-height:42px;font-size:12.5px;line-height:1.2}
.hint{font-size:12px;opacity:.8;line-height:1.45}
#intro{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:rgba(20,14,36,.72);padding:24px}
#intro .card{background:#fff;color:#2a1f3d;border:3px solid #2a1f3d;box-shadow:6px 6px 0 rgba(0,0,0,.35);padding:20px;max-width:380px;line-height:1.55;font-size:15px}
#intro h1{font-size:22px;margin-bottom:8px}#intro button{width:100%;margin-top:14px;background:#8a5a2b;font-size:16px}
#intro ol{padding-left:20px;margin-top:8px;font-size:14px}
</style></head><body>
<div id="screen">
  <div class="widget"><div class="clock" id="clock">12:00</div><div class="date" id="date"></div></div>
  <div class="grid" id="grid"></div>

</div>
<canvas id="ball" width="8" height="8"></canvas>
<button id="menuBtn">🎮 메뉴</button>
<div id="panel">
  <h2>시아·정우 펫 🏃‍♀️🥋</h2>
  <div class="row" id="toggles"></div>
  <div class="row" id="pickers"></div>
  <div class="row"><button id="rand">🎲 랜덤 모션</button><button id="snd">소리 켜짐</button></div>
  <!--SPICYBTN-->
  <div class="row" id="sizes"></div>
  <div id="moves"></div>
  <p class="hint">톡: 인사 · 잡고 던지기: 띠용~ · 꾹 누르기: 이 메뉴 · 둘을 같이 켜두면 만났을 때 서로 반응해요.</p>
</div>
<div id="intro"><div class="card">
  <h1>시아·정우 펫 🏃‍♀️🥋</h1>
  <p>달리기 대장 시아와 태권도 3단 MC 정우가 이 화면을 뛰어다녀요. 잡아서 던지고, 톡 눌러보세요.</p>
  <ol><li>아이폰: 사파리 아래 <b>공유 버튼 → 홈 화면에 추가</b></li><li>안드로이드 크롬: <b>⋮ → 홈 화면에 추가</b></li></ol>
  <p style="font-size:13px;margin-top:8px;opacity:.75">홈 화면 아이콘으로 열면 앱처럼 전체 화면으로 떠요. 아이폰은 이 화면 안에서만 움직여요.</p>
  <button id="go">시작하기</button>
</div></div>
<script>/* ===== 도트 스프라이트 (24x24) — 안드로이드 앱의 Sprite 코드를 그대로 옮김 ===== */
function makePx(g){return (x,y,w,h,c)=>{g.fillStyle=c;g.fillRect(x,y,w,h)}}
const LEGS={stand:[[6,0,3,3],[12,0,3,3]],walkA:[[5,0,3,3],[13,0,3,3]],walkB:[[7,0,3,3],[11,0,3,2]],runA:[[5,0,3,2],[13,0,3,3]],tuck:[[6,0,3,2],[12,0,3,2]],dangle:[[7,0,3,3],[11,0,3,3]],sit:[[5,0,4,2],[12,0,4,2]],kick:[[6,0,3,3],[13,-1,3,2]]};
const SHOES={stand:[[5,3,4,1],[12,3,4,1]],walkA:[[4,3,4,1],[13,3,4,1]],walkB:[[7,3,4,1],[11,2,4,1]],runA:[[3,1,3,1],[13,3,4,1]],tuck:[[5,2,4,1],[12,2,4,1]],dangle:[[7,3,3,1],[11,3,3,1]],sit:[[3,0,2,2],[16,0,2,2]],kick:[[5,3,4,1],[16,-2,2,3]]};
const SPARK='#ffe45e',TEAR='#5bc0ff',TONGUE='#ff7a9a',M_IN='#6b2230',BLUSH='#f29a9a',EYE='#1c1b24';

function propAnchor(aR,by,bear){
  if(bear)return{up:[17,by-5],out:[20,by+1],wave:[19,by-4],hip:[17,by+3],hold:[14,by+2],paw:[15,by-3]}[aR]||[17,by+5];
  return{up:[16,by-5],out:[20,by+1],wave:[18,by-4],hip:[16,by+3],hold:[13,by+2]}[aR]||[16,by+5];
}
function drawProp(px,p,by,bear){
  const pr=p.prop;if(!pr)return;const [ax,ay]=propAnchor(p.aR,by,bear);const dark='#22222c',white='#ffffff';
  switch(pr){
    case'phone':px(ax,ay-2,2,3,dark);px(ax,ay-2,2,2,'#6fd3ff');break;
    case'coffee':px(ax-1,ay-2,3,3,white);px(ax-1,ay-2,3,1,'#6b3e1e');px(ax+2,ay-1,1,1,white);break;
    case'book':px(ax-3,ay-2,5,4,'#3b6fd8');px(ax-2,ay-1,3,2,white);break;
    case'mic':px(ax,ay-3,2,2,'#666677');px(ax,ay-1,1,2,dark);break;
    case'drumstick':px(ax-1,ay-2,3,2,'#c8782e');px(ax+1,ay,1,1,'#a8581e');px(ax+2,ay+1,1,1,white);break;
    case'icecream':px(ax,ay-3,2,2,'#ffb6c8');px(ax,ay-1,2,1,'#d9a24a');break;
    case'balloon':px(ax,ay-6,1,6,'#dddddd');px(ax-1,ay-9,3,3,'#ff4f7a');px(ax-1,ay-9,1,1,'#ffc0d0');break;
    case'camera':px(ax-2,ay-2,4,3,'#333344');px(ax-1,ay-1,2,1,'#6fd3ff');px(ax+1,ay-3,1,1,'#333344');break;
    case'flower':px(ax,ay-1,1,3,'#3a9a4a');px(ax-1,ay-3,3,2,'#ff6f96');px(ax,ay-3,1,1,SPARK);break;
    case'heart':{const h='#ff4f7a';px(ax-2,ay-4,1,1,h);px(ax,ay-4,1,1,h);px(ax-2,ay-3,3,1,h);px(ax-1,ay-2,1,1,h);break}
    case'dumbbell':px(0,by-6,22,1,'#777788');px(bear?-1:0,by-8,2,4,'#333344');px(20,by-8,2,4,'#333344');break;
    case'dumbbellDown':px(1,by+5,20,1,'#777788');px(0,by+3,2,4,'#333344');px(19,by+3,2,4,'#333344');break;
    case'guitar':px(9,by+2,6,4,'#b5651d');px(10,by+1,4,1,'#b5651d');px(11,by+3,2,2,'#3a2410');px(15,by+2,5,1,'#5a3a1e');px(20,by+1,1,2,'#3a2410');break;
    case'laptop':px(4,19,12,1,'#bfbfc8');px(5,15,10,4,'#3a3a46');px(6,16,8,2,'#6fd3ff');break;
    case'honey':px(ax-2,ay-2,4,3,'#d9a24a');px(ax-2,ay-3,4,1,'#f5c518');px(ax-1,ay-1,2,1,'#fff1b0');px(ax+1,ay+1,1,1,'#f5c518');break;
    case'salmon':px(ax-3,ay-1,6,2,'#f08a6a');px(ax+3,ay-2,1,4,'#e07050');px(ax-3,ay-1,1,1,dark);px(ax-1,ay,3,1,'#ffc0a8');break;
    case'berry':px(ax-1,ay-2,2,2,'#d93a4e');px(ax,ay-3,1,1,'#3a9a4a');px(ax-1,ay-2,1,1,'#ff8a9a');break;
    case'snowball':px(ax-1,ay-2,3,3,'#f4f8ff');px(ax+1,ay,1,1,'#cfe0f5');break;
    case'lunchbox':px(ax-3,ay-1,6,3,'#e8312a');px(ax-3,ay-1,6,1,'#ffb0a0');break;
    case'cupramen':px(ax-1,ay-3,3,3,white);px(ax-1,ay-2,3,1,'#e8312a');px(ax-1,ay-3,3,1,'#f5c518');break;
    case'pillow':px(10,18,8,3,white);px(11,19,6,1,'#dde6f5');break;
  }
}

/* ---------- 진행해줘 부장님 ---------- */
const PC={hair:'#1a1a20',hairHi:'#3a3a46',skin:'#f1c6a0',skinSh:'#d49c78',lid:'#5a3a30',mouth:'#9a5040',shirt:'#f0a38a',shirtSh:'#d4826b',shirtHi:'#fbc3ae',pants:'#2b3d6b',shoe:'#f4f4f4',pen:'#3b6fd8',penTip:'#e8e8e8',penCap:'#22222c',
 feather:'#f7ecd6',featherSh:'#e0cba6',featherHi:'#fffaf0',comb:'#e8312a',beak:'#f5c518',beakSh:'#d99a0b',foot:'#f2b705',claw:'#6b4a2b',chLid:'#b08a6a',box:'#d93a2e',boxIn:'#fff6ee',fried:'#a8581e',fried2:'#d88a34'};
function drawPink(g,p,form,now){
  const px=makePx(g);g.save();g.translate(2,0);const by=p.by,ch=form==='chicken';
  // legs
  const pc=ch?PC.foot:PC.pants,sc=ch?PC.foot:PC.shoe;
  (LEGS[p.legs]||LEGS.stand).forEach(r=>px(r[0]+(ch?1:0),p.ly+r[1],ch?1:r[2],r[3],pc));
  (SHOES[p.legs]||SHOES.stand).forEach(r=>{px(r[0],p.ly+r[1],r[2],r[3],sc);if(ch)px(r[0]+r[2]-1,p.ly+r[1]+r[3]-1,1,1,PC.claw)});
  if(ch&&p.legs!=='sit'){px(5,p.ly,11,1,PC.feather);px(6,p.ly+1,9,1,PC.featherSh)}
  if(ch){px(1,by+1,4,4,PC.feather);px(0,by-1,2,3,PC.featherHi);px(2,by,2,2,PC.featherHi);px(1,by+4,3,1,PC.featherSh)}
  px(5,by,11,6,PC.shirt);px(5,by+5,11,1,PC.shirtSh);px(8,by,5,1,PC.shirtSh);
  for(let r=1;r<5;r++){px(r%2?7:6,by+r,1,1,PC.shirtHi);px(10,by+r,1,1,r%2?PC.shirtHi:PC.shirtSh);px(r%2?13:14,by+r,1,1,PC.shirtHi)}
  const hand=ch?PC.featherHi:PC.skin;
  for(const side of[-1,1]){const t=side<0?p.aL:p.aR;const R=(x,y,w,h,c)=>side<0?px(x,y,w,h,c):px(21-x-w,y,w,h,c);
    if(t==='down'){R(3,by+1,2,4,PC.shirt);R(3,by+5,2,1,hand)}else if(t==='up'){R(3,by-4,2,5,PC.shirt);R(3,by-5,2,1,hand)}
    else if(t==='out'){R(1,by+1,3,2,PC.shirt);R(0,by+1,1,2,hand)}else if(t==='wave'){R(2,by-3,2,4,PC.shirt);R(1,by-4,2,1,hand)}
    else if(t==='hip'){R(3,by+1,2,2,PC.shirt);R(4,by+3,1,1,hand)}else if(t==='hold'){R(3,by+1,2,2,PC.shirt);R(4,by+3,3,1,PC.shirt);R(7,by+2,1,1,hand)}}
  const h=(x,y,w,hh,c)=>px(x+p.hx,y+p.hy,w,hh,c);const l=p.look<0?0:1;
  if(ch){
    h(8,0,2,1,PC.comb);h(11,0,2,1,PC.comb);h(7,1,8,1,PC.comb);h(14,0,1,1,PC.comb);
    h(4,2,13,3,PC.hair);h(8,2,4,1,PC.hairHi);h(3,3,1,2,PC.hair);h(17,3,1,2,PC.hair);
    h(4,5,13,6,PC.feather);h(5,11,11,1,PC.feather);h(3,7,1,3,PC.featherHi);h(17,7,1,3,PC.featherHi);h(4,10,1,1,PC.featherSh);h(16,10,1,1,PC.featherSh);
    h(4,5,2,1,PC.hair);h(15,5,2,1,PC.hair);h(7,6,2,1,PC.hair);h(12,6,3,1,PC.hair);
    if(p.eyes==='closed'){h(7,7,2,1,PC.lid);h(12,7,2,1,PC.lid)}
    else{const e=p.eyes==='sparkle'?SPARK:EYE;h(7,7,2,1,PC.chLid);h(12,7,2,1,PC.chLid);h(7+l,8,1,1,e);if(p.eyes==='wink')h(12,8,2,1,PC.lid);else h(12+l,8,1,1,e);
      if(p.eyes==='wide'){h(7+l,7,1,1,EYE);h(12+l,7,1,1,EYE)}if(p.eyes==='tear'){h(7+l,9,1,2,TEAR);h(12+l,9,1,2,TEAR)}}
    h(9,8,4,1,PC.beak);h(13,8,1,1,PC.beakSh);const op=['open','o','grin','tongue'].includes(p.mouth);
    if(op){h(10,9,3,1,M_IN);h(10,10,3,1,PC.beakSh)}else h(10,9,3,1,PC.beakSh);
    h(10,op?11:10,2,2,PC.comb);h(12,10,1,1,PC.comb);h(6,9,2,1,BLUSH);h(14,9,2,1,BLUSH);
  }else{
    const pw=form==='power',hr=pw?(Math.floor(now/90)%2?'#ff3d75':'#ff6f96'):PC.hair,hh=pw?'#ffe0ea':PC.hairHi;
    h(6,1,9,1,hr);h(4,2,13,3,hr);h(9,2,5,1,hh);h(7,2,1,2,hh);
    if(pw){[5,8,11,14].forEach(sx=>h(sx,0,1,1,hr));h(3,2,1,2,hr);h(17,2,1,2,hr);h(2,1,1,1,hr);h(18,1,1,1,hr)}
    h(5,5,11,6,PC.skin);h(6,11,9,1,PC.skin);h(5,10,1,1,PC.skinSh);h(15,10,1,1,PC.skinSh);
    h(4,5,1,2,hr);h(16,5,1,1,hr);h(8,5,6,1,hr);h(14,5,1,1,hh);
    h(4,7,1,2,PC.skin);h(16,7,1,2,PC.skin);h(4,8,1,1,PC.skinSh);h(16,8,1,1,PC.skinSh);
    h(7,6,2,1,PC.hair);h(12,6,2,1,PC.hair);if(pw){h(9,7,1,1,PC.hair);h(11,7,1,1,PC.hair)}
    if(p.eyes==='closed'){h(7,7,2,1,PC.lid);h(12,7,2,1,PC.lid)}

const pets={};
function syncPets(){for(const id of IDS){const on=store.get('on_'+id,true);
  if(on&&!pets[id]){const p=new Pet(DEFS[id]);p.spawn(IDS.indexOf(id)?.7:.3);pets[id]=p}
  else if(!on&&pets[id]){pets[id].remove();delete pets[id]}}
hook();

/* 시아 + 정우 상호작용 */
function hook(){if(pets.woo)pets.woo.onCrash=cx=>pets.sia&&pets.sia.interact('angry',cx,'야! 유정우! 화면 깨졌잖아!')}
let interCool=3;
function interactions(dt){const s=pets.sia,w=pets.woo;if(!s||!w)return;interCool-=dt;if(interCool>0)return;if(s.state==='away'||w.state==='away')return;
 if(Math.abs(s.x-w.x)>13*SC||Math.abs(s.y-w.y)>18*SC)return;interCool=7;
 if(['air','drag'].includes(s.state)||['air','drag'].includes(w.state)||s.act==='run'||w.act==='run'){s.bump(w.x);w.bump(s.x);s.say('앗 미안!',1.4);w.say('괜찮아 누나!',1.4);return}
 if(!s.canInteract||!w.canInteract){interCool=2;return}
 const mid=(s.x+w.x)/2,top=Math.min(s.y,w.y)-24*SC;
 switch(fl(Math.random()*7)){
  case 0:s.interact('sprint',w.x,'달리기 시합 할래?');w.interact('dash',s.x,'좋아! 누가 이기나 보자!');s.sayLater('내가 이겼지~ ㅋㅋ',2.6);w.sayLater('누나 너무 빨라!!',3.2);break;
  case 1:s.interact('shoot',w.x,'패스!');w.interact('ballHold',s.x,'나이스 패스!');floatText('🏀',mid,top,'boing');break;
  case 2:s.interact('highfive',w.x,'하이파이브!');w.interact('highfive',s.x,null);floatText('짝!',mid,top,'boing');sfx.pop();break;
  case 3:s.interact('malaDream',w.x,'마라탕 먹자!');w.interact('beefDream',s.x,'아니야 소고기 먹자!');s.sayLater('…둘 다 먹자!',2.4);w.sayLater('콜!!',3);break;
  case 4:w.interact('mcInterview',s.x,'박시아 선수, 우승 소감은요?');s.interact('laugh',w.x,null);s.sayLater('히히 다 같이 열심히 했어요!',1.6);break;
  case 5:w.interact('frontKick',s.x,'누나 내 앞차기 봐!');s.interact('cheerWoo',w.x,'오~ 태권도 3단!');break;
  default:s.interact('okCall',w.x,'정우야 편의점 갈래?');w.interact('thumbsup',s.x,'라면 사자!')}}

 document.getElementById('sizes').innerHTML=[[2,'작게'],[3,'보통'],[4,'크게']].map(([v,l])=>`<button data-s="${v}" class="${SC===v?'on':''}">크기 ${l}</button>`).join('');
 const d=DEFS[target];document.getElementById('moves').innerHTML=menuOf(d).map(([k,l])=>`<button data-m="${k}"></button>`).join('');
 [...document.querySelectorAll('#moves button')].forEach((b,i)=>b.textContent=menuOf(d)[i][1]);
 document.getElementById('snd').textContent=soundOn?'소리 켜짐 🔊':'소리 꺼짐 🔇';const sp=document.getElementById('spicy');if(sp)sp.textContent=spicyOn?'🌶 엄마 매운맛 대사 켜짐':'🌶 엄마 매운맛 대사 꺼짐'}
function doMove(k){ensureAudio();if(!pets[target]){store.set('on_'+target,true);syncPets()}const p=pets[target];if(p){if(p.state==='act'||p.state==='land')p.force(k);else setTimeout(()=>p.force(k),800)}panel.classList.remove('on')}
panel.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;ensureAudio();
 if(b.dataset.t){const id=b.dataset.t;store.set('on_'+id,!pets[id]);syncPets()}
 else if(b.dataset.p){target=b.dataset.p;store.set('target',target);renderPanel()}
 else if(b.dataset.s){store.set('size',+b.dataset.s);resize();renderPanel()}
 else if(b.dataset.m)doMove(b.dataset.m)});
document.getElementById('rand').onclick=()=>doMove(pick(menuOf(DEFS[target]))[0]);
const spb=document.getElementById('spicy');if(spb)spb.onclick=()=>{spicyOn=!spicyOn;store.set('spicy',spicyOn);renderPanel()};
document.getElementById('snd').onclick=()=>{soundOn=!soundOn;store.set('sound',soundOn);renderPanel()};
document.getElementById('go').onclick=()=>{ensureAudio();document.getElementById('intro').remove();store.set('seen',true)};
if(store.get('seen',false)||matchMedia('(display-mode: standalone)').matches||navigator.standalone)document.getElementById('intro').remove();

/* 루프 */
function resize(){SC=store.get('size',innerWidth>=600?2.5:2);computePlats();for(const p of Object.values(pets)){if(p.state!=='drag'&&p.state!=='away'){p.x=Math.max(minX,Math.min(maxX,p.x));if(p.state!=='air')p.goAir(0,0,'fall')}}}
addEventListener('resize',()=>setTimeout(resize,150));
ball.init();resize();syncPets();
let last=performance.now();
function loop(now){const dt=Math.min(.033,(now-last)/1000);last=now;const ms=Date.now();
 for(const p of Object.values(pets)){p.update(dt,ms);p.render(ms)}interactions(dt);ball.update(dt);requestAnimationFrame(loop)}
requestAnimationFrame(loop);
}
</script>
</body></html>
